# Warnings: check the STE reference before you keep these.
[check]
need = "STE: check the reference; often 'must have' or 'necessary'"
needs = "STE: check the reference; often 'must have' or 'necessary'"
want = "STE: check the reference"
allow = "STE: check the reference; often 'let' or 'can'"
allows = "STE: check the reference; often 'let' or 'can'"
enable = "STE: check the reference; often 'turn on' or 'let'"
appear = "STE: check the reference; often 'show'"
appears = "STE: check the reference; often 'shows'"
display = "STE: check the reference; often 'show'"
should = "STE: check the reference; use 'must' for a requirement"
may = "STE: check the reference; often 'can'"
might = "STE: check the reference; often 'can'"
able = "STE: check the reference; use 'can'"
require = "STE: check the reference"
requires = "STE: check the reference"
instantly = "give the condition: while WalletFeed is open"
immediately = "give the condition or the time"
automatically = "STE: check the reference"
via = "through"
however = "STE: check the reference; often 'but'"
therefore = "STE: check the reference; often 'thus' or 'so'"
once = "STE: check the reference; as a conjunction, use 'after' or 'when'"

[phrases]
"in order to" = "to"
"click here" = "describe the link target"
"it's worth noting" = "remove it"
"it is worth noting" = "remove it"
"note that" = "remove it, or make it a note"
"real time" = "say 'within seconds while WalletFeed is open, and within about an hour when it is closed'"
"real-time" = "say 'within seconds while WalletFeed is open, and within about an hour when it is closed'"
"the only way" = "don't claim exclusivity"
"never leaves your iphone" = "not true for destinations: say where the data goes"
